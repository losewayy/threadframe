<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThreadFrame · Playground</title>
  <style>
    :root {
      color-scheme: dark;
      --pg-bg: light-dark(#f3f5f9, #151921);
      --pg-panel: light-dark(#fff, #202630);
      --pg-text: light-dark(#1c2634, #edf1f7);
      --pg-muted: light-dark(#556276, #adb9ca);
      --pg-focus: light-dark(#1659a2, #a3c9ff);
      --pg-button-text: light-dark(#fff, #122846);
      --pg-soft: color-mix(in srgb, var(--pg-text) 6%, transparent);
      --pg-border: color-mix(in srgb, var(--pg-text) 12%, transparent);
    }
    :root:has(.light-host) { color-scheme: light; }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--pg-bg);
      color: var(--pg-text);
      font: .9375rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    button, select { font: inherit; }
    button, select, summary { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    :focus-visible { outline: 2px solid var(--pg-focus); outline-offset: 3px; }

    .top { border-bottom: 1px solid var(--pg-border); }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      max-width: 74rem;
      margin-inline: auto;
      padding: 17px clamp(14px, 3vw, 28px);
    }
    .brand-mark, .assistant-mark {
      display: grid;
      flex: none;
      place-items: center;
      border-radius: 10px;
      background: color-mix(in srgb, var(--pg-focus) 10%, transparent);
      color: var(--pg-focus);
    }
    .brand-mark { width: 36px; height: 36px; }
    h1 { margin: 0; font-size: 1rem; font-weight: 650; line-height: 1.25; }
    .sub { margin: 2px 0 0; color: var(--pg-muted); font-size: .8125rem; }
    [data-pg-icon] svg { width: 17px; height: 17px; }
    .workspace { max-width: 74rem; margin-inline: auto; padding: 22px clamp(14px, 3vw, 28px); }
    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .toolbar label { margin-inline-end: 2px; color: var(--pg-muted); font-size: .8125rem; }
    select, button {
      min-height: 37px;
      padding: 6px 12px;
      border: 0;
      border-radius: 9px;
      background: var(--pg-soft);
      color: var(--pg-text);
      font-size: .8125rem;
      font-weight: 600;
    }
    select { max-width: 100%; }
    button:hover, select:hover { background: color-mix(in srgb, var(--pg-text) 10%, transparent); }
    button.primary { background: var(--pg-focus); color: var(--pg-button-text); }
    button.primary:hover { filter: brightness(.94); }
    #theme-btn { margin-inline-start: auto; }

    .wrap {
      display: grid;
      grid-template-columns: minmax(0, var(--preview-width, 760px)) minmax(230px, 1fr);
      align-items: start;
      gap: 26px;
      margin-top: 24px;
    }
    .thread { min-width: 0; }
    .thread-heading { margin: 0 0 18px; color: var(--pg-muted); font-size: .875rem; font-weight: 600; }
    .user-message {
      width: fit-content;
      max-width: 85%;
      margin: 0 0 18px auto;
      padding: 10px 14px;
      border-radius: 16px 16px 5px 16px;
      background: var(--pg-soft);
      font-size: .875rem;
    }
    .assistant-heading { display: flex; align-items: center; gap: 8px; font-size: .875rem; font-weight: 600; }
    .assistant-mark { width: 26px; height: 26px; border-radius: 50%; }
    .assistant-mark svg { width: 15px; height: 15px; }
    iframe { display: block; width: 100%; min-height: 240px; border: 0; background: transparent; }

    .traffic {
      position: sticky;
      top: 22px;
      min-width: 0;
      padding-inline-start: 18px;
      border-inline-start: 1px solid var(--pg-border);
    }
    summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 34px;
      font-size: .875rem;
      font-weight: 650;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; color: var(--pg-muted); font-size: 1.125rem; font-weight: 400; }
    details[open] summary::after { content: "−"; }
    .traffic-caption { margin: 4px 0 10px; color: var(--pg-muted); font-size: .8125rem; }
    .log-box {
      max-height: 36rem;
      padding-inline-end: 8px;
      overflow-y: auto;
      overflow-wrap: anywhere;
      color: var(--pg-muted);
      font: .75rem/1.6 ui-monospace, "SFMono-Regular", Consolas, monospace;
      white-space: pre-wrap;
      scrollbar-width: thin;
    }

    .custom-spec {
      padding: 4px 14px;
      border-radius: 12px;
      background: var(--pg-soft);
    }
    .custom-spec[open] { padding-bottom: 12px; }
    .custom-spec label { display: block; margin: 10px 0 6px; color: var(--pg-muted); font-size: .8125rem; }
    .custom-spec textarea {
      width: 100%;
      min-height: 12rem;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      resize: vertical;
      background: var(--pg-panel);
      color: var(--pg-text);
      font: .875rem/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    .custom-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .spec-error { color: light-dark(#a32d2d, #ffb4b4); white-space: pre-wrap; font-size: .875rem; }
    .message-preview {
      margin: 10px 0 0;
      padding: 8px 12px;
      border-radius: 9px;
      background: var(--pg-soft);
      font-size: .875rem;
      overflow-wrap: anywhere;
    }
    [hidden] { display: none !important; }

    @media (max-width: 960px) {
      .wrap { grid-template-columns: minmax(0, var(--preview-width, 760px)); justify-content: center; }
      .traffic { position: static; padding: 10px 0 0; border-inline-start: 0; border-top: 1px solid var(--pg-border); }
      .log-box { max-height: 14rem; }
    }
    @media (max-width: 540px) {
      .toolbar label { position: absolute; clip-path: inset(50%); }
      select { width: 100%; }
      #theme-btn { margin-inline-start: 0; }
      .user-message { max-width: 92%; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="brand-mark" data-pg-icon aria-hidden="true"></span><div><h1>ThreadFrame</h1><p class="sub">Playground</p></div></div>
  </header>
  <div class="workspace">
    <div class="toolbar" role="group" aria-label="Preview settings">
      <label for="preset-select">Scenario</label>
      <select id="preset-select" aria-label="Scenario">
        <option value="gpu-vram-tuner">GPU VRAM &amp; Throughput Tuner</option>
        <option value="runtime-compare">Inference Backend Matrix</option>
        <option value="deploy-checklist">MCP App Release Checklist</option>
        <option value="mcp-architecture">4-Layer Architecture Stack</option>
        <option value="composable-workbench">Composable Deployment Workbench</option>
        <option value="svg-visual-lab">Vector Visual Lab</option>
        <option value="agent-launch-kit">Inference Service Launch Kit</option>
      </select>
      <button id="stream-btn" class="primary" type="button">Replay stream</button>
      <button id="width-btn" type="button">Width: Wide (760px)</button>
      <button id="theme-btn" type="button">Host Theme: Dark</button>
    </div>
    <details class="custom-spec">
      <summary>Custom JSON Spec</summary>
      <label for="custom-json">Paste a UiSpec to validate and preview</label>
      <textarea id="custom-json" spellcheck="false">{"title":"Custom view","blocks":[{"kind":"callout","body":"Replace this with your own UI spec."}]}</textarea>
      <div class="custom-actions"><button id="run-custom" class="primary" type="button">Run Spec</button><button id="stream-custom" type="button">Simulate Stream</button></div>
      <p id="spec-error" class="spec-error" role="alert" hidden></p>
    </details>
    <main class="wrap">
      <section class="thread" aria-label="Desktop chat preview">
        <h2 class="thread-heading">Desktop chat preview</h2>
        <div class="user-message" id="user-prompt">Help me tune my local model to fit my GPU.</div>
        <div class="assistant-heading"><span class="assistant-mark" data-pg-icon aria-hidden="true"></span>Assistant</div>
        <div id="bubble" class="chat-bubble">
          <iframe id="host-frame" title="Interactive ThreadFrame" sandbox="allow-scripts" allow="clipboard-write *" src="/view"></iframe>
        </div>
        <p id="message-preview" class="message-preview" role="status" hidden></p>
      </section>
      <details class="traffic" open>
        <summary>Bridge activity</summary>
        <p class="traffic-caption">JSON-RPC 2.0 · Latest messages first</p>
        <div id="rpc-log" class="log-box" aria-label="JSON-RPC bridge traffic"></div>
      </details>
    </main>
  </div>
  <script>
    const frame = document.getElementById("host-frame");
    const bubble = document.getElementById("bubble");
    const presetSelect = document.getElementById("preset-select");
    const streamBtn = document.getElementById("stream-btn");
    const themeBtn = document.getElementById("theme-btn");
    const logEl = document.getElementById("rpc-log");
    const messagePreview = document.getElementById("message-preview");
    let messageTimer;

    let hostTheme = "dark";
    let frameReady = false;
    let presetsData = {};
    let activeTimers = [];

    function logRpc(dir, payload) {
      const line = "[" + dir + "] " + JSON.stringify(payload).slice(0, 220);
      logEl.textContent = line + "\n" + logEl.textContent;
    }

    function postToFrame(msg) {
      frame.contentWindow.postMessage(msg, "*");
      logRpc("HOST -> VIEW", msg);
    }

    function clearTimers() {
      activeTimers.forEach(clearTimeout);
      activeTimers = [];
    }

    function runStreamSimulation(key) {
      const spec = presetsData[key];
      if (spec) runSpecStream(spec);
    }

    function runSpecStream(spec) {
      if (!frameReady) return;
      clearTimers();

      const steps = spec.blocks.length;
      postToFrame({
        jsonrpc: "2.0",
        method: "ui/notifications/tool-input-partial",
        params: { arguments: { title: spec.title, subtitle: spec.subtitle, badge: spec.badge, blocks: [] } }
      });

      for (let i = 1; i <= steps; i++) {
        const t = setTimeout(() => {
          const partialArgs = {
            title: spec.title,
            subtitle: spec.subtitle,
            badge: spec.badge,
            blocks: spec.blocks.slice(0, i)
          };
          if (i < steps) {
            postToFrame({
              jsonrpc: "2.0",
              method: "ui/notifications/tool-input-partial",
              params: { arguments: partialArgs }
            });
          } else {
            postToFrame({
              jsonrpc: "2.0",
              method: "ui/notifications/tool-input",
              params: { arguments: spec }
            });
            postToFrame({
              jsonrpc: "2.0",
              method: "ui/notifications/tool-result",
              params: { structuredContent: spec }
            });
          }
        }, i * 520);
        activeTimers.push(t);
      }
    }

    window.addEventListener("message", (event) => {
      if (event.source !== frame.contentWindow) return;
      const msg = event.data;
      if (!msg || typeof msg !== "object") return;

      if (msg.method === "ui/notifications/size-changed" && msg.params && typeof msg.params.height === "number") {
        frame.style.height = Math.max(240, Math.ceil(msg.params.height) + 4) + "px";
        return;
      }

      logRpc("VIEW -> HOST", msg);

      if (msg.method === "ui/initialize" && msg.id !== undefined) {
        postToFrame({
          jsonrpc: "2.0",
          id: msg.id,
          result: {
            protocolVersion: "2026-01-26",
            hostInfo: { name: "threadframe-playground", version: "0.3.0" },
            hostCapabilities: { openLinks: {}, message: { text: {} } },
            hostContext: { theme: hostTheme }
          }
        });
      } else if (msg.method === "ui/notifications/initialized") {
        frameReady = true;
        runStreamSimulation(presetSelect.value);
      } else if (msg.method === "ui/message" && msg.id !== undefined) {
        postToFrame({ jsonrpc: "2.0", id: msg.id, result: {} });
        const content = Array.isArray(msg.params?.content) ? msg.params.content : [];
        messagePreview.textContent = "Sent to agent: " + content.filter((part) => part.type === "text" && typeof part.text === "string").map((part) => part.text).join("\n");
        messagePreview.hidden = false;
        clearTimeout(messageTimer);
        messageTimer = setTimeout(() => { messagePreview.hidden = true; }, 6000);
      }
    });

    streamBtn.addEventListener("click", () => runStreamSimulation(presetSelect.value));
    presetSelect.addEventListener("change", () => runStreamSimulation(presetSelect.value));
    themeBtn.addEventListener("click", () => {
      hostTheme = hostTheme === "dark" ? "light" : "dark";
      themeBtn.textContent = "Host Theme: " + (hostTheme === "dark" ? "Dark" : "Light");
      bubble.classList.toggle("light-host", hostTheme === "light");
      if (frameReady) {
        postToFrame({
          jsonrpc: "2.0",
          method: "ui/notifications/host-context-changed",
          params: { theme: hostTheme }
        });
      }
    });

    fetch("/presets.json")
      .then((r) => r.json())
      .then((data) => {
        presetsData = data;
        if (frameReady) runStreamSimulation(presetSelect.value);
      });
  </script>
  <script>
    document.querySelectorAll("[data-pg-icon]").forEach((container) => {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "1.5");
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", "m12 3 3 6 6 3-6 3-3 6-3-6-6-3 6-3 3-6Z");
      svg.appendChild(path);
      container.appendChild(svg);
    });
    let compactPreview = false;
    document.getElementById("width-btn").addEventListener("click", (event) => {
      compactPreview = !compactPreview;
      document.documentElement.style.setProperty("--preview-width", compactPreview ? "420px" : "760px");
      event.currentTarget.textContent = compactPreview ? "Width: Compact (420px)" : "Width: Wide (760px)";
    });
    const customError = document.getElementById("spec-error");
    async function runCustom(streaming) {
      const buttons = [document.getElementById("run-custom"), document.getElementById("stream-custom")];
      customError.hidden = true;
      buttons.forEach((button) => { button.disabled = true; });
      try {
        if (!frameReady) throw new Error("The preview is starting. Try again in a moment.");
        const input = JSON.parse(document.getElementById("custom-json").value);
        const response = await fetch("/validate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(input) });
        const result = await response.json();
        if (!response.ok) throw new Error((result.issues ?? []).map((issue) => (issue.path.join(".") || "spec") + ": " + issue.message).join("\n") || "Validation failed");
        clearTimers();
        if (streaming) runSpecStream(result.spec);
        else {
          postToFrame({ jsonrpc: "2.0", method: "ui/notifications/tool-input", params: { arguments: result.spec } });
          postToFrame({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: { structuredContent: result.spec } });
        }
      } catch (error) {
        customError.textContent = error.message;
        customError.hidden = false;
      } finally {
        buttons.forEach((button) => { button.disabled = false; });
      }
    }
    document.getElementById("run-custom").addEventListener("click", () => runCustom(false));
    document.getElementById("stream-custom").addEventListener("click", () => runCustom(true));
    const prompts = {
      "gpu-vram-tuner": "Help me tune my local model to fit my GPU.",
      "runtime-compare": "Compare the inference backends and help me choose.",
      "deploy-checklist": "What should I check before releasing my MCP app?",
      "mcp-architecture": "Show me how the MCP app layers fit together.",
      "composable-workbench": "Help me plan an inference deployment and check its memory budget.",
      "svg-visual-lab": "Show me how load and response change the plots and vector diagrams.",
      "agent-launch-kit": "Help me configure targets, check readiness, and prepare a service launch command."
    };
    document.getElementById("preset-select").addEventListener("change", (event) => {
      document.getElementById("user-prompt").textContent = prompts[event.target.value];
    });
  </script>
</body>
</html>
